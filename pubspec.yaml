name: iquiz
description: "PDF 학습 자료로 퀴즈를 만들고 학습 결과를 관리하는 앱"
publish_to: 'none'
version: 0.0.1+5

environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  file_picker: ^13.1.0
  go_router: ^17.5.0
  flutter_dotenv: ^6.0.1
  logger: ^2.8.0
  intl: ^0.20.3
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  json_annotation: ^4.12.0
  lottie: ^3.3.2
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  inspire_blur: ^0.4.1
  package_info_plus: ^10.2.2
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  dart_style: ^3.1.14
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  path: ^1.9.1
  swagger_parser: 1.45.0
  flutter_flavorizr: ^2.6.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  default-flavor: dev
  assets:
    - .env
    - assets/
    - assets/lottie/
    - assets/icons/
    - assets/branding/
    - assets/home/
    - assets/data/
    - assets/licenses/

  fonts:
  - family: pretendard
    fonts:
      - asset: assets/fonts/pretendard/Pretendard-Regular.otf
        weight: 400
      - asset: assets/fonts/pretendard/Pretendard-Medium.otf
        weight: 500
      - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
        weight: 600
      - asset: assets/fonts/pretendard/Pretendard-Bold.otf
        weight: 800
